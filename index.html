<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/x-icon" href="circle-256.ico" />
  <link rel="manifest" href="manifest.json" />
  <script data-goatcounter="https://oled.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <title>OLED - Keep Screen Awake</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #ff7a00;
      --dot-opacity: 0.9;
      --text-opacity: 0.9;
      --muted-opacity: 0.7;
    }

    body.brightness-low {
      --dot-opacity: 0.55;
      --text-opacity: 0.65;
      --muted-opacity: 0.5;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
      cursor: none;
    }

    html, body, body * { cursor: none; }

    body.cursor-visible,
    body.cursor-visible * { cursor: default; }

    #dot {
      position: fixed;
      left: 0;
      top: 0;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0;
      transform: translate3d(0,0,0);
      pointer-events: none;
      transition: opacity 220ms ease, background-color 300ms ease;
    }

    body.boot #dot { transition: opacity 1800ms ease, background-color 300ms ease; }
    body.ready.dot-visible #dot { opacity: var(--dot-opacity); }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: monospace;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transition: opacity 600ms ease, color 300ms ease;
    }

    #status.show { opacity: var(--text-opacity); }

    #status .main {
      font-size: 44px;
      letter-spacing: 2px;
    }

    #status .hint {
      margin-top: 10px;
      font-size: 12px;
      opacity: var(--muted-opacity);
    }

    #status .hint .primary {
      font-size: 16px;
      display: inline-block;
      margin-bottom: 16px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate3d(-50%, 0, 0);
      font-family: monospace;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease, color 300ms ease;
      text-align: center;
    }

    #toast.show { opacity: var(--text-opacity); }

    #toast .main {
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    #hold {
      position: fixed;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      transform: translate3d(-9999px,-9999px,0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }

    #hold.show { opacity: var(--text-opacity); }

    #hold svg {
      width: 56px;
      height: 56px;
      display: block;
      transform: rotate(-90deg);
    }

    #hold .bg,
    #hold .fg {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
    }

    #hold .bg { opacity: 0.2; }

    #hold .fg {
      stroke-linecap: round;
      stroke-dasharray: 1 999;
      stroke-dashoffset: 0;
    }

    #colorPanel {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.72);
      z-index: 10;
      font-family: monospace;
      color: var(--accent);
    }

    #colorPanel.show { display: grid; }

    #colorCard {
      min-width: 220px;
      padding: 22px;
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: #050505;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }

    #colorCard .title {
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    #colorPicker {
      width: 120px;
      height: 56px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    #resetColor {
      display: block;
      margin: 14px auto 0;
      padding: 8px 12px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }

    #resetColor:hover {
      background: var(--accent);
      color: #000;
    }

    #colorCard .hint {
      margin-top: 12px;
      font-size: 11px;
      opacity: var(--muted-opacity);
    }
  </style>
</head>
<body tabindex="0">

  <div id="dot"></div>
  <div id="status"></div>
  <div id="toast"></div>

  <div id="hold" aria-hidden="true">
    <svg viewBox="0 0 56 56">
      <circle class="bg" cx="28" cy="28" r="20"></circle>
      <circle class="fg" cx="28" cy="28" r="20"></circle>
    </svg>
  </div>

  <div id="colorPanel">
    <div id="colorCard">
      <div class="title">COLOR</div>
      <input id="colorPicker" type="color" value="#ff7a00" aria-label="Choose accent color" />
      <button id="resetColor" type="button">RESET DEFAULT</button>
      <div class="hint">
        Tap outside to close<br>
        <span id="colorCountdown">Auto-closes in 15s</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const CURSOR_IDLE_MS = 500;
      const HOLD_MS = 700;
      const HINT_SHOW_MS = 3000;
      const COLOR_PANEL_IDLE_MS = 15000;

      const DEFAULT_COLOR = "#ff7a00";
      const LS_COLOR_KEY = "accentColor";
      const LS_BRIGHTNESS_KEY = "brightnessMode";

      let wakeLock = null;
      let wakeLockPending = false;
      let wakeLockFailed = false;

      const dot = document.getElementById("dot");
      const statusEl = document.getElementById("status");
      const toastEl = document.getElementById("toast");
      const holdEl = document.getElementById("hold");
      const holdFg = holdEl.querySelector(".fg");
      const colorPanel = document.getElementById("colorPanel");
      const colorPicker = document.getElementById("colorPicker");
      const resetColor = document.getElementById("resetColor");
      const colorCountdown = document.getElementById("colorCountdown");

      const DOT_SIZE = 34;
      const DOT_BLIP_MS = 450;
      const DOT_INTERVAL_MS = 2200;
      const DOT_INTERVAL_JITTER_MS = 1200;

      let dotTimer = null;
      let dotHideTimer = null;
      let x = 100;
      let y = 100;
      let toastHide = null;
      let overlayHide = null;
      let cursorTimer = null;
      let colorPanelIdleTimer = null;
      let colorPanelCountdownTimer = null;
      let colorPanelDeadline = 0;

      let holding = false;
      let holdRAF = null;
      let holdStart = 0;
      let holdDone = false;

      const R = 20;
      const CIRC = 2 * Math.PI * R;

      let brightnessMode = (localStorage.getItem(LS_BRIGHTNESS_KEY) ?? "0") === "1";
      let accentColor = localStorage.getItem(LS_COLOR_KEY) || DEFAULT_COLOR;

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function isValidHexColor(value) {
        return /^#[0-9a-f]{6}$/i.test(value);
      }

      function applyColor(value, save) {
        if (!isValidHexColor(value)) return;
        accentColor = value;
        document.documentElement.style.setProperty("--accent", accentColor);
        colorPicker.value = accentColor;
        if (save) localStorage.setItem(LS_COLOR_KEY, accentColor);
      }

      function place(xPos, yPos) {
        dot.style.transform = "translate3d(" + xPos + "px," + yPos + "px, 0)";
      }

      function dotBounds() {
        return {
          maxX: Math.max(0, window.innerWidth - DOT_SIZE),
          maxY: Math.max(0, window.innerHeight - DOT_SIZE)
        };
      }

      function shouldRunDot() {
        return document.visibilityState === "visible" && !colorPanel.classList.contains("show");
      }

      function moveDot() {
        const bounds = dotBounds();
        x = rand(0, bounds.maxX);
        y = rand(0, bounds.maxY);
        place(x, y);
      }

      function setDotVisible(visible) {
        document.body.classList.toggle("dot-visible", visible);
      }

      function scheduleDotBlip(delay) {
        dotTimer = setTimeout(() => {
          dotTimer = null;
          showDotBlip();
        }, delay);
      }

      function showDotBlip() {
        if (!shouldRunDot()) {
          setDotVisible(false);
          return;
        }

        moveDot();
        setDotVisible(true);

        if (dotHideTimer) clearTimeout(dotHideTimer);
        dotHideTimer = setTimeout(() => {
          dotHideTimer = null;
          setDotVisible(false);
          if (shouldRunDot()) {
            scheduleDotBlip(DOT_INTERVAL_MS + rand(0, DOT_INTERVAL_JITTER_MS));
          }
        }, DOT_BLIP_MS);
      }

      function startDotCycle() {
        if (dotTimer || dotHideTimer || !shouldRunDot()) return;
        showDotBlip();
      }

      function stopDotCycle() {
        if (dotTimer) clearTimeout(dotTimer);
        if (dotHideTimer) clearTimeout(dotHideTimer);
        dotTimer = null;
        dotHideTimer = null;
        setDotVisible(false);
      }

      function showHintFor(ms) {
        if (overlayHide) clearTimeout(overlayHide);

        statusEl.innerHTML = `
          <div>
            <div class="main">ACTIVE</div>
            <div class="hint">
              <span class="primary">Keeps your OLED screen awake</span><br>
              Hold click = color<br>
              B = brightness<br>
              F = fullscreen<br>
              H = hint
            </div>
          </div>
        `;

        statusEl.classList.add("show");
        overlayHide = setTimeout(() => statusEl.classList.remove("show"), ms);
      }

      function showTinyToast(text) {
        if (toastHide) clearTimeout(toastHide);
        toastEl.innerHTML = `<div class="main">${text}</div>`;
        toastEl.classList.add("show");
        toastHide = setTimeout(() => toastEl.classList.remove("show"), 700);
      }

      async function requestLock() {
        if (!navigator.wakeLock || wakeLock || wakeLockPending) return false;
        wakeLockPending = true;

        try {
          const sentinel = await navigator.wakeLock.request("screen");
          wakeLock = sentinel;
          wakeLockFailed = false;

          sentinel.addEventListener("release", () => {
            if (wakeLock !== sentinel) return;
            wakeLock = null;
            if (document.visibilityState === "visible") requestLock();
          });

          return true;
        } catch {
          if (!wakeLockFailed) {
            wakeLockFailed = true;
            showTinyToast("LOCK FAILED");
          }
          return false;
        } finally {
          wakeLockPending = false;
        }
      }

      function toggleBrightness() {
        brightnessMode = !brightnessMode;
        localStorage.setItem(LS_BRIGHTNESS_KEY, brightnessMode ? "1" : "0");
        document.body.classList.toggle("brightness-low", brightnessMode);
        showTinyToast(brightnessMode ? "BRIGHTNESS LOW" : "BRIGHTNESS HIGH");
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (_) {}
      }

      function stopColorPanelTimer() {
        if (colorPanelIdleTimer) clearTimeout(colorPanelIdleTimer);
        if (colorPanelCountdownTimer) clearInterval(colorPanelCountdownTimer);
        colorPanelIdleTimer = null;
        colorPanelCountdownTimer = null;
      }

      function updateColorPanelCountdown() {
        if (!colorPanel.classList.contains("show")) return;
        const secondsLeft = Math.max(0, Math.ceil((colorPanelDeadline - Date.now()) / 1000));
        colorCountdown.textContent = "Auto-closes in " + secondsLeft + "s";
      }

      function resetColorPanelTimer() {
        if (!colorPanel.classList.contains("show")) return;

        stopColorPanelTimer();
        colorPanelDeadline = Date.now() + COLOR_PANEL_IDLE_MS;
        updateColorPanelCountdown();

        colorPanelCountdownTimer = setInterval(updateColorPanelCountdown, 250);
        colorPanelIdleTimer = setTimeout(closeColorPanel, COLOR_PANEL_IDLE_MS);
      }

      function openColorPanel() {
        stopDotCycle();
        colorPanel.classList.add("show");
        document.body.classList.add("cursor-visible");
        resetColorPanelTimer();
      }

      function closeColorPanel() {
        stopColorPanelTimer();
        colorPanel.classList.remove("show");
        hideCursor();
        startDotCycle();
      }

      function showHoldAt(clientX, clientY) {
        holdEl.style.transform = "translate3d(" + clientX + "px," + clientY + "px,0) translate3d(-50%,-50%,0)";
        holdEl.classList.add("show");
        holdFg.style.strokeDasharray = CIRC + " " + CIRC;
        holdFg.style.strokeDashoffset = String(CIRC);
      }

      function hideHold() {
        holdEl.classList.remove("show");
        holdEl.style.transform = "translate3d(-9999px,-9999px,0)";
      }

      function stopHoldLoop() {
        if (holdRAF) cancelAnimationFrame(holdRAF);
        holdRAF = null;
      }

      function startHoldLoop() {
        stopHoldLoop();
        holdDone = false;

        function tick(now) {
          if (!holding) return;

          const elapsed = now - holdStart;
          const progress = Math.max(0, Math.min(1, elapsed / HOLD_MS));
          holdFg.style.strokeDashoffset = String(CIRC * (1 - progress));

          if (progress >= 1 && !holdDone) {
            holdDone = true;
            holding = false;
            hideHold();
            openColorPanel();
            return;
          }

          holdRAF = requestAnimationFrame(tick);
        }

        holdRAF = requestAnimationFrame(tick);
      }

      function onUserActivity() {
        if (colorPanel.classList.contains("show")) return;
        document.body.classList.add("cursor-visible");
        if (cursorTimer) clearTimeout(cursorTimer);
        cursorTimer = setTimeout(hideCursor, CURSOR_IDLE_MS);
      }

      function hideCursor() {
        if (colorPanel.classList.contains("show")) return;
        document.body.classList.remove("cursor-visible");
        if (cursorTimer) clearTimeout(cursorTimer);
        cursorTimer = null;
      }

      document.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || e.target.closest("#colorPanel")) return;
        e.preventDefault();

        onUserActivity();
        holding = true;
        holdStart = performance.now();
        showHoldAt(e.clientX, e.clientY);
        startHoldLoop();
      });

      document.addEventListener("pointermove", (e) => {
        onUserActivity();
        if (holding) showHoldAt(e.clientX, e.clientY);
      });

      document.addEventListener("pointerup", (e) => {
        if (e.button !== 0 || e.target.closest("#colorPanel")) return;
        e.preventDefault();

        onUserActivity();
        if (!holding) return;

        holding = false;
        stopHoldLoop();
        hideHold();
      });

      document.addEventListener("pointercancel", () => {
        if (!holding) return;
        holding = false;
        stopHoldLoop();
        hideHold();
      });

      colorPicker.addEventListener("input", (e) => {
        applyColor(e.target.value, true);
        resetColorPanelTimer();
      });

      resetColor.addEventListener("click", () => {
        localStorage.removeItem(LS_COLOR_KEY);
        applyColor(DEFAULT_COLOR, false);
        resetColorPanelTimer();
      });

      colorPanel.addEventListener("pointerdown", (e) => {
        if (e.target !== colorPanel) resetColorPanelTimer();
      });

      colorPanel.addEventListener("click", (e) => {
        if (e.target === colorPanel) closeColorPanel();
      });

      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "hidden") {
          stopDotCycle();
          return;
        }

        startDotCycle();
        hideCursor();
        if (!wakeLock) await requestLock();
      });

      window.addEventListener("resize", () => {
        const bounds = dotBounds();
        x = Math.min(x, bounds.maxX);
        y = Math.min(y, bounds.maxY);
        place(x, y);
      });

      document.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        onUserActivity();
        showHintFor(HINT_SHOW_MS);
      });

      document.addEventListener("keydown", (e) => {
        onUserActivity();

        if (e.key === "Escape" && colorPanel.classList.contains("show")) {
          e.preventDefault();
          closeColorPanel();
          return;
        }

        if (e.key === "b" || e.key === "B") {
          e.preventDefault();
          toggleBrightness();
          return;
        }

        if (e.key === "f" || e.key === "F") {
          e.preventDefault();
          toggleFullscreen();
          return;
        }

        if (e.key === "h" || e.key === "H") {
          e.preventDefault();
          showHintFor(HINT_SHOW_MS);
        }
      });

      async function removeOldAppCaches() {
        if ("serviceWorker" in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          } catch (_) {}
        }

        if ("caches" in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          } catch (_) {}
        }
      }

      (async function init() {
        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.has("_cache_reset")) {
          currentUrl.searchParams.delete("_cache_reset");
          history.replaceState(null, "", currentUrl.pathname + currentUrl.search + currentUrl.hash);
        }

        applyColor(accentColor, false);
        document.body.classList.toggle("brightness-low", brightnessMode);

        startDotCycle();
        showHintFor(HINT_SHOW_MS);

        document.body.classList.add("boot");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.add("ready");
            setTimeout(() => document.body.classList.remove("boot"), 1000);
          });
        });

        hideCursor();
        await removeOldAppCaches();
        await requestLock();

        setInterval(() => {
          if (!wakeLock && document.visibilityState === "visible") requestLock();
        }, 30000);

        window.addEventListener("pageshow", (e) => {
          hideCursor();
          if (e.persisted && !wakeLock) requestLock();
        });
      })();
    })();
  </script>
</body>
</html>
